[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "eurosat-denoising"
version = "0.1.0"
dependencies = ["torch", "torchvision", "numpy"]
[tool.setuptools.packages.find]
where = ["src"]
[project.scripts]
eurosat-denoise = "eurosat_denoising.cli:main"
eurosat-report = "eurosat_denoising.report:main"
